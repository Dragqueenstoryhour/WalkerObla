version: '3'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
      - "5050:5050"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
    volumes:
      - ./:/app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]