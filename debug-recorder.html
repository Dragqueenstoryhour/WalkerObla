<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Azure Speech Debug Recorder</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      background-color: #f5f5f5;
    }
    h1 {
      color: #0078d4;
      text-align: center;
    }
    .container {
      background-color: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 20px 0;
    }
    button {
      background-color: #0078d4;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #005a9e;
    }
    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
    .recording {
      background-color: #d13438;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-bottom: 10px;
      font-size: 16px;
    }
    .status {
      background-color: #f0f0f0;
      padding: 10px;
      border-radius: 4px;
      margin-top: 10px;
      max-height: 200px;
      overflow-y: auto;
      font-family: monospace;
    }
    .error {
      color: #d13438;
    }
    .success {
      color: #107c10;
    }
    .response-container {
      margin-top: 20px;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 10px;
      max-height: 400px;
      overflow: auto;
      background-color: #fafafa;
    }
    pre {
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 14px;
    }
    .meter {
      width: 100%;
      height: 30px;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin: 10px 0;
      position: relative;
      overflow: hidden;
    }
    .meter-fill {
      height: 100%;
      width: 0;
      background-color: #0078d4;
      transition: width 0.1s;
    }
  </style>
</head>
<body>
  <h1>Azure Speech Debug Recorder</h1>
  
  <div class="container">
    <h2>1. Record Audio</h2>
    <div class="meter">
      <div class="meter-fill" id="volumeMeter"></div>
    </div>
    <div class="controls">
      <button id="recordButton">Start Recording</button>
      <button id="stopButton" disabled>Stop Recording</button>
      <button id="playButton" disabled>Play Recording</button>
    </div>
    <div class="status" id="recordingStatus">Recording status will appear here...</div>
  </div>
  
  <div class="container">
    <h2>2. Configure Assessment</h2>
    <label for="referenceText">Reference Text (what should be spoken):</label>
    <input type="text" id="referenceText" value="Hello, how are you today?" />
    <button id="testButton" disabled>Test Pronunciation Assessment</button>
  </div>
  
  <div class="container">
    <h2>3. Results</h2>
    <div class="status" id="requestStatus">Results will appear here after testing...</div>
    <div class="response-container">
      <pre id="responseJson"></pre>
    </div>
  </div>

  <script>
    // Global variables
    let audioContext;
    let recorder;
    let audioStream;
    let audioBlob;
    let audioUrl;
    let audioPlayer = new Audio();
    
    // DOM elements
    const recordButton = document.getElementById('recordButton');
    const stopButton = document.getElementById('stopButton');
    const playButton = document.getElementById('playButton');
    const testButton = document.getElementById('testButton');
    const recordingStatus = document.getElementById('recordingStatus');
    const requestStatus = document.getElementById('requestStatus');
    const responseJson = document.getElementById('responseJson');
    const volumeMeter = document.getElementById('volumeMeter');
    const referenceText = document.getElementById('referenceText');
    
    // Initialize the recorder
    recordButton.addEventListener('click', startRecording);
    stopButton.addEventListener('click', stopRecording);
    playButton.addEventListener('click', playRecording);
    testButton.addEventListener('click', testPronunciation);
    
    // Start recording
    async function startRecording() {
      try {
        // Set up audio context
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        // Get microphone access
        audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        
        // Set up volume meter
        const analyser = audioContext.createAnalyser();
        const microphone = audioContext.createMediaStreamSource(audioStream);
        const scriptProcessor = audioContext.createScriptProcessor(2048, 1, 1);
        
        analyser.smoothingTimeConstant = 0.8;
        analyser.fftSize = 1024;
        
        microphone.connect(analyser);
        analyser.connect(scriptProcessor);
        scriptProcessor.connect(audioContext.destination);
        
        scriptProcessor.onaudioprocess = function() {
          const array = new Uint8Array(analyser.frequencyBinCount);
          analyser.getByteFrequencyData(array);
          const values = array.reduce((a, b) => a + b, 0) / array.length;
          const volume = Math.min(100, Math.round(values * 2));
          volumeMeter.style.width = volume + '%';
        };
        
        // Set up MediaRecorder
        recorder = new MediaRecorder(audioStream);
        const chunks = [];
        
        recorder.ondataavailable = (e) => {
          chunks.push(e.data);
        };
        
        recorder.onstop = () => {
          // Create the audio blob
          audioBlob = new Blob(chunks, { type: 'audio/webm' });
          audioUrl = URL.createObjectURL(audioBlob);
          
          // Set up the audio player
          audioPlayer.src = audioUrl;
          
          // Update UI
          recordingStatus.innerHTML += '<br>Recording stopped. Audio ready.';
          playButton.disabled = false;
          testButton.disabled = false;
          
          // Clean up the audio context
          if (scriptProcessor) {
            scriptProcessor.disconnect();
          }
          if (microphone) {
            microphone.disconnect();
          }
          if (analyser) {
            analyser.disconnect();
          }
        };
        
        // Start recording
        recorder.start();
        
        // Update UI
        recordButton.disabled = true;
        recordButton.classList.add('recording');
        stopButton.disabled = false;
        recordingStatus.innerHTML = 'Recording started... Speak now!';
        
      } catch (error) {
        recordingStatus.innerHTML = `<span class="error">Error accessing microphone: ${error.message}</span>`;
        console.error('Error accessing microphone:', error);
      }
    }
    
    // Stop recording
    function stopRecording() {
      if (recorder && recorder.state === 'recording') {
        recorder.stop();
        audioStream.getTracks().forEach(track => track.stop());
        
        // Update UI
        recordButton.disabled = false;
        recordButton.classList.remove('recording');
        stopButton.disabled = true;
        volumeMeter.style.width = '0';
      }
    }
    
    // Play the recorded audio
    function playRecording() {
      if (audioUrl) {
        audioPlayer.play();
        recordingStatus.innerHTML += '<br>Playing recorded audio...';
      }
    }
    
    // Test pronunciation assessment
    async function testPronunciation() {
      if (!audioBlob) {
        requestStatus.innerHTML = '<span class="error">No recording available. Please record audio first.</span>';
        return;
      }
      
      try {
        requestStatus.innerHTML = 'Sending request to Azure Speech Services...';
        testButton.disabled = true;
        
        // Create form data
        const formData = new FormData();
        formData.append('audio', audioBlob);
        formData.append('text', referenceText.value);
        
        // Send request to debug endpoint
        const response = await fetch('/api/debug/pronunciation', {
          method: 'POST',
          body: formData
        });
        
        const data = await response.json();
        
        // Format and display the response
        const formattedJson = JSON.stringify(data, null, 2);
        responseJson.textContent = formattedJson;
        
        // Update UI based on success or failure
        if (response.ok && data.result && data.result.pronunciationScore) {
          requestStatus.innerHTML = `<span class="success">Success! Overall Pronunciation Score: ${data.result.pronunciationScore.toFixed(1)}</span>`;
        } else {
          const errorMessage = data.error || 'Unknown error';
          requestStatus.innerHTML = `<span class="error">Error: ${errorMessage}</span>`;
        }
      } catch (error) {
        console.error('Error testing pronunciation:', error);
        requestStatus.innerHTML = `<span class="error">Error: ${error.message}</span>`;
        responseJson.textContent = `${error.stack || error.message}`;
      } finally {
        testButton.disabled = false;
      }
    }
  </script>
</body>
</html>
